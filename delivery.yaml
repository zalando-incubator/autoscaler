version: "2017-09-20"
pipeline:
  - id: build
    type: script
    vm_config:
      type: linux
      size: large
      image: cdp-runtime/base
    working_dir: /go/src/k8s.io/autoscaler
    env:
      VERSION: "v0.6.1-internal"
      DOWNSTREAM: "registry-write.opensource.zalan.do/teapot/kube-cluster-autoscaler"
    commands:
      - desc: "Installing dependencies"
        cmd: |
          apt-get update
          apt-get install libseccomp-dev python -qq

          curl https://dl.google.com/go/go1.11.13.linux-amd64.tar.gz -o go1.11.13.linux-amd64.tar.gz
          rm -rf /usr/local/go && tar -C /usr/local -xzf go1.11.13.linux-amd64.tar.gz
          tee -a  ~/.profile << END
          export GOROOT=/usr/local/go
          export GOPATH=/go
          export PATH=\$PATH:\$GOROOT/bin:\$GOPATH/bin 
          END
          source ~/.profile
          go version

          hack/install-verify-tools.sh
      - desc: "Verify"
        cmd: |
          rm .zappr.yaml
          export EXCLUDE=verify-golint.sh
          hack/verify-all.sh -v
      - desc: "Build and release"
        cmd: |
          if [[ "${CDP_TARGET_BRANCH}" != "zalando-vertical-pod-autoscaler" || -n "${CDP_PULL_REQUEST_NUMBER}" ]]; then
            export TAG="${VERSION}.dev-${CDP_TARGET_REPOSITORY_COUNTER}"
          else
            export TAG="${VERSION}.${CDP_TARGET_BRANCH_COUNTER}"
          fi

          export REGISTRY=registry-write.opensource.zalan.do/teapot
          
          for COMPONENT in admission-controller recommender updater; do
            (
              cd vertical-pod-autoscaler/pkg/$COMPONENT
              make test-unit
              make release
              docker buildx create --config /etc/cdp-buildkitd.toml --driver-opt network=host --use
              docker buildx build --rm -t container-registry-test.zalando.net/teapot/vpa-${COMPONENT}:${TAG} --platform linux/amd64,linux/arm64 --push .
              cdp-promote-image container-registry-test.zalando.net/teapot}/vpa-${COMPONENT}:${TAG}
            )
          done
